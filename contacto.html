<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Ir a inicio</a></li>
            </ul>
        </nav>
        <h1>Deja tus datos para ser contactado</h1>
    </header>
    <main>
        <h2>Formulario de contacto</h2>
        <p>Al diligenciar el formulario será contactado para recibir toda la información del curso.</p>
        <form action="#" method="post">
            <label for="name">Nombre</label>
            <input type="text" id="name" name="name">

            <label for="email">Correo</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Teléfono</label>
            <input type="tel" id="phone" name="phone">

            <input type="checkbox" id="experience" name="experience">
            <label for="experience">Marque si tiene experiencia previa</label>

            <button type="submit">Enviar</button>
        </form>
    </main>
    <footer>
        <p>Aprendiendo desarrollo | 2026</p>
    </footer>
</body>
</html>
