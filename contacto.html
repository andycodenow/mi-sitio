<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Ir a inicio</a></li>
            </ul>
        </nav>
        <h1>Deje sus datos para ser contactado</h1>
    </header>
    <main>
        <h2>Formulario de contacto</h2>
        <p>Al diligenciar el formulario será contactado para recibir toda la información del curso.</p>
        <form action="#" method="post">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre">

            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" required>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono">

            <input type="checkbox" id="experiencia-curso" name="experiencia-curso">
            <label for="experiencia-curso">Marque si tiene experiencia con cursos en línea</label>

            <fieldset>
                <legend>¿Cuál es su nivel de experiencia para el curso aplicado?</legend>

                <input type="radio" id="alta-experiencia" name="experiencia" value="alta-experiencia" required>
                <label for="alta-experiencia">Alto</label>

                <input type="radio" id="media-experiencia" name="experiencia" value="media-experiencia">
                <label for="media-experiencia">Medio</label>

                <input type="radio" id="baja-experiencia" name="experiencia" value="baja-experiencia">
                <label for="baja-experiencia">Bajo</label>
            </fieldset>

            <button type="submit">Enviar</button>
        </form>
    </main>
    <footer>
        <p>Aprendiendo desarrollo | 2026</p>
    </footer>
</body>
</html>
